name: release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist_cmd: npm run dist:win
          - os: ubuntu-22.04
            dist_cmd: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux packaging tools (rpm for Fedora/openSUSE, libarchive for Arch)
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3; do
            sudo apt-get update || true
            sudo apt-get install -y --fix-missing rpm libarchive-tools && break || sleep 5
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check release metadata and desktop server
        run: |
          node tools/release-check.js
          node tools/desktop-server-check.js

      - name: Check server suggestions
        if: runner.os == 'Linux'
        run: python3 tools/suggestions-check.py

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Patch fpm RPM template for modern rpmbuild
        if: runner.os == 'Linux'
        working-directory: electron
        run: |
          FPM_DIR=$(node_modules/app-builder-bin/linux/x64/app-builder download-artifact --name=fpm)
          python3 -c '
          path = "'"$FPM_DIR"'/lib/app/templates/rpm.erb"
          with open(path, "r") as f:
              content = f.read()
          target = "%install\n# noop\n"
          replacement = """%install
          if [ "%{buildroot}" != "%{_topdir}/BUILD" ]; then
            mkdir -p "%{buildroot}"
            for f in "%{_topdir}/BUILD"/*; do
              if [ "$f" != "%{_topdir}/BUILD/%{name}-%{version}-build" ]; then
                cp -al "$f" "%{buildroot}/" 2>/dev/null || cp -a "$f" "%{buildroot}/"
              fi
            done
          fi
          """
          if target in content:
              with open(path, "w") as f:
                  f.write(content.replace(target, replacement, 1))
              print("Patched fpm rpm.erb successfully")
          else:
              print("fpm rpm.erb already patched or target not found")
          '

      - name: Build desktop packages
        working-directory: electron
        run: ${{ matrix.dist_cmd }}

      - name: Package AUR archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p electron/dist
          tar -czvf electron/dist/proxypress-bin-aur.tar.gz -C aur PKGBUILD .SRCINFO README.md

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          name: Proxy Press ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          overwrite_files: true
          draft: true
          files: |
            electron/dist/*.exe
            electron/dist/*.msi
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.rpm
            electron/dist/*.pacman
            electron/dist/*-aur.tar.gz

      - name: Save desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            electron/dist/*.exe
            electron/dist/*.msi
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.rpm
            electron/dist/*.pacman
            electron/dist/*-aur.tar.gz

  publish-release:
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check downloads and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > release-assets.json
          python3 - <<'PY'
          import json, os
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          expected = {f"Proxy-Press-{version}.{ext}" for ext in ("exe", "msi", "AppImage", "deb", "rpm", "pacman")}
          expected.add("proxypress-bin-aur.tar.gz")
          uploaded = {a["name"] for a in json.load(open("release-assets.json"))["assets"] if a["size"] > 0}
          missing = expected - uploaded
          if missing:
              raise SystemExit("Missing release downloads: " + ", ".join(sorted(missing)))
          print("All seven release downloads are present.")
          PY
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Sync historical releases to minimal 0.x.x notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sync-releases.py
