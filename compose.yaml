services:
  proxy-press:
    build: .
    image: proxy-press:latest
    container_name: proxy-press
    restart: unless-stopped
    ports:
      - "${PROXY_PRESS_BIND:-127.0.0.1}:${PROXY_PRESS_PORT:-8642}:8642"
    environment:
      PASSWORD: "${PROXY_PRESS_PASSWORD:-}"
      BASIC_AUTH: "${PROXY_PRESS_AUTH:-}"
    read_only: true
    volumes:
      - ./assets:/app/assets:ro,z
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
